<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Меню — Brew &amp; Bean</title>
  <meta name="description" content="Меню кав’ярні Brew & Bean: кава та випічка.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main">Перейти до основного вмісту</a>

  <header>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Меню</button>

    <nav id="site-nav" aria-label="Головна навігація">
      <a href="index.html">Головна</a>
      <a href="menu.html">Меню</a>
      <a href="cart.html">Кошик (<span data-cart-count>0</span>)</a>
    </nav>

    <button type="button" data-theme-toggle></button>
  </header>

  <main id="main">
    <h1>Меню</h1>

    <div class="filters" role="search">
      <p>
        <label for="search">Пошук за назвою</label>
        <input type="search" id="search" placeholder="Наприклад, лате">
      </p>
      <p>
        <label for="category">Категорія</label>
        <select id="category">
          <option value="">Усі</option>
          <option value="Кава">Кава</option>
          <option value="Чай">Чай</option>
          <option value="Десерти">Десерти</option>
          <option value="Сніданки">Сніданки</option>
        </select>
      </p>
      <p>
        <label for="sort">Сортування</label>
        <select id="sort">
          <option value="default">За замовчуванням</option>
          <option value="price-asc">Ціна: від дешевших</option>
          <option value="price-desc">Ціна: від дорожчих</option>
          <option value="name">За назвою</option>
        </select>
      </p>
    </div>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Усі позиції</h2>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="menu-grid" class="grid"></div>
    </section>
  </main>

  <dialog id="item-modal">
    <h2 data-modal-title></h2>
    <p data-modal-desc></p>
    <p data-modal-price></p>
    <button type="button" data-modal-add>У кошик</button>
    <button type="button" data-close>Закрити</button>
  </dialog>

  <footer>
    <p>© 2026 Brew &amp; Bean. Київ, вул. Прикладна, 1.</p>
    <p><a href="tel:+380441234567">+38&nbsp;(044)&nbsp;123&#8209;45&#8209;67</a> · <a href="mailto:hello@brewandbean.example">hello@brewandbean.example</a></p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
